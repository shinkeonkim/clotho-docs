name: Documentation issue
description: 잘못되거나 이해하기 어려운 문서를 알려주세요.
title: "[Docs] "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: 문서 위치
      placeholder: 페이지 URL 또는 파일 경로
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 문제 설명
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 제안하는 내용
